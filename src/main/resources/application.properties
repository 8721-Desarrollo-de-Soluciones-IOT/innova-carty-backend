spring.application.name=innova-carty-platform
server.port=${PORT:8080}
server.error.include-message=always

# Database: Supabase (PostgreSQL) through the session pooler in production.
# Without these variables the API starts with an in-memory H2 database (handy in IntelliJ).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:innovacarty;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Own schema, so the tables are not published by the Supabase Data API (it only exposes "public")
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:innovacarty}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Security
innovacarty.jwt.secret=${JWT_SECRET:change-me-innova-carty-local-secret-32-chars}
innovacarty.jwt.ttl-hours=${JWT_TTL_HOURS:12}
innovacarty.device.api-key=${DEVICE_API_KEY:innova-device-key}

# Health check for Render and API docs
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
